<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview — Animated Doctor on Login</title>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Mukta', sans-serif;
    background: #0b1f33; color: #fff;
    min-height: 100vh; overflow-x: hidden;
  }
  /* पार्श्वभूमी blobs */
  .bg-fx { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .bg-fx i { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .5; }
  .bg-fx i:nth-child(1) { width: 300px; height: 300px; background: #0d9488; top: -80px; left: -80px; opacity: .18; }
  .bg-fx i:nth-child(2) { width: 340px; height: 340px; background: #1a4a72; top: 35%; right: -110px; opacity: .35; }
  .bg-fx i:nth-child(3) { width: 280px; height: 280px; background: #b45309; bottom: -90px; left: 25%; opacity: .16; }

  .stage { position: relative; z-index: 1; max-width: 400px; margin: 0 auto; padding: 84px 16px 20px; }

  /* ===== Doctor — main path animation (26s loop) ===== */
  .doc-move {
    position: absolute; left: 50%; top: 0; width: 108px; z-index: 4;
    transform: translate(-50%, -58px);
    filter: drop-shadow(0 8px 12px rgba(0,0,0,.4));
    animation: docPath 26s ease-in-out infinite;
  }
  @keyframes docPath {
    0%, 10%   { left: 50%; transform: translate(-50%,-58px) scale(1); z-index: 4; }
    16%, 20%  { left: -72px; transform: translate(0,150px) scale(1); z-index: 6; }
    27%       { left: -26px; transform: translate(0,158px) scale(1.14); z-index: 6; }
    33%       { left: -72px; transform: translate(0,150px) scale(1); z-index: 6; }
    36%       { left: 50%; transform: translate(-50%,90px) scale(1); z-index: 4; }
    41%, 45%  { left: calc(100% - 36px); transform: translate(0,150px) scale(1); z-index: 6; }
    51%       { left: calc(100% - 82px); transform: translate(0,158px) scale(1.14); z-index: 6; }
    57%       { left: calc(100% - 36px); transform: translate(0,150px) scale(1); z-index: 6; }
    60%       { left: 50%; transform: translate(-50%,90px) scale(1); z-index: 4; }
    65%, 76%  { left: 50%; transform: translate(-50%,-58px) scale(1); z-index: 4; }
    79%, 88%  { left: 50%; transform: translate(-50%,14px) scale(1); z-index: 4; }
    94%, 100% { left: 50%; transform: translate(-50%,-58px) scale(1); z-index: 4; }
  }
  .doc-bob { animation: bob 2.6s ease-in-out infinite; position: relative; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

  /* SVG part animations */
  .doc-head { transform-box: fill-box; transform-origin: 50% 82%; animation: headLook 26s ease-in-out infinite; }
  @keyframes headLook {
    0%        { transform: rotate(-7deg); }
    5%        { transform: rotate(7deg); }
    10%, 16%  { transform: rotate(-7deg); }
    20%       { transform: rotate(0deg); }
    24%, 30%  { transform: rotate(13deg) translateX(3px); }
    33%, 40%  { transform: rotate(0deg); }
    45%       { transform: rotate(0deg); }
    48%, 54%  { transform: rotate(-13deg) translateX(-3px); }
    57%, 63%  { transform: rotate(0deg); }
    68%       { transform: rotate(8deg); }
    72%       { transform: rotate(-8deg); }
    76%, 100% { transform: rotate(0deg); }
  }
  .pupil { transform-box: fill-box; transform-origin: center; animation: pupilLook 26s ease-in-out infinite; }
  @keyframes pupilLook {
    0%        { transform: translate(-2.4px, 0); }
    5%        { transform: translate(2.4px, 0); }
    10%, 20%  { transform: translate(0, 0); }
    24%, 33%  { transform: translate(0, 2.6px); }
    36%, 44%  { transform: translate(0, 0); }
    48%, 57%  { transform: translate(0, 2.6px); }
    60%, 64%  { transform: translate(0, 0); }
    68%       { transform: translate(-2.4px, 0); }
    72%       { transform: translate(2.4px, 0); }
    76%, 100% { transform: translate(0, 0); }
  }
  .eye-blink { transform-box: fill-box; transform-origin: center; animation: blink 4.2s infinite; }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.08); } }
  .arm-r { transform-box: fill-box; transform-origin: 50% 10%; animation: wave 26s ease-in-out infinite; }
  @keyframes wave {
    0%, 43%   { transform: rotate(0deg); }
    46%       { transform: rotate(-150deg); }
    50%       { transform: rotate(-118deg); }
    54%       { transform: rotate(-150deg); }
    58%, 100% { transform: rotate(0deg); }
  }
  .steth { transform-box: fill-box; transform-origin: 50% 0%; animation: sway 3.4s ease-in-out infinite; }
  @keyframes sway { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }

  /* तपासणी भिंग — lean वेळी हातात दिसते */
  .mag {
    position: absolute; top: 88px; left: 74px; font-size: 26px; opacity: 0;
    animation: magPop 26s ease-in-out infinite;
  }
  @keyframes magPop {
    0%, 22%   { opacity: 0; transform: scale(.5) rotate(-20deg); }
    26%, 30%  { opacity: 1; transform: scale(1) rotate(8deg); }
    34%, 46%  { opacity: 0; transform: scale(.5) rotate(-20deg); }
    50%, 54%  { opacity: 1; transform: scale(1) rotate(8deg); }
    58%, 100% { opacity: 0; transform: scale(.5) rotate(-20deg); }
  }

  /* ===== Login card (real app सारखी) ===== */
  .card-wrap { position: relative; }
  .login-card {
    position: relative; z-index: 5;
    background: rgba(18,40,63,.92); border: 1px solid rgba(255,255,255,.15);
    border-radius: 24px; padding: 24px; backdrop-filter: blur(20px);
    box-shadow: 0 20px 50px rgba(0,0,0,.45);
  }
  .logo { text-align: center; margin-bottom: 18px; }
  .logo-mark {
    width: 64px; height: 64px; margin: 0 auto; border-radius: 18px;
    background: linear-gradient(135deg, #fcd34d, #f97316);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 20px rgba(249,115,22,.4);
  }
  .logo h1 {
    margin: 10px 0 2px; font-size: 26px; font-weight: 800;
    background: linear-gradient(90deg, #fff, #fde68a, #fcd34d);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .logo p { margin: 0; font-size: 13px; color: #94a3b8; }
  .tabs { position: relative; display: grid; grid-template-columns: 1fr 1fr; background: rgba(0,0,0,.25);
    border: 1px solid rgba(255,255,255,.1); border-radius: 16px; padding: 4px; margin-bottom: 20px; }
  .tabs .ind { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px);
    border-radius: 12px; background: linear-gradient(90deg, #fcd34d, #fb923c); }
  .tabs span { position: relative; z-index: 1; text-align: center; font-size: 13px; font-weight: 700; padding: 9px 4px; }
  .tabs span.on { color: #0b1f33; } .tabs span.off { color: #94a3b8; }
  .fld { margin-bottom: 14px; }
  .fld label { display: block; font-size: 12px; font-weight: 700; color: #cbd5e1; margin-bottom: 6px; }
  .fld input {
    width: 100%; box-sizing: border-box; border-radius: 12px; border: 1px solid rgba(255,255,255,.15);
    background: rgba(255,255,255,.1); padding: 10px 12px 10px 36px; color: #fff; font-size: 14px; outline: none;
  }
  .fld input::placeholder { color: #64748b; }
  .fld .wrap { position: relative; } .fld .wrap i { position: absolute; left: 11px; top: 11px; font-size: 15px; opacity: .7; }
  .btn {
    width: 100%; border: none; cursor: pointer; border-radius: 12px; padding: 12px;
    font-size: 15px; font-weight: 800; color: #0b1f33; font-family: inherit;
    background: linear-gradient(90deg, #fcd34d, #fb923c); box-shadow: 0 6px 18px rgba(249,115,22,.35);
  }
  .foot { text-align: center; font-size: 12px; color: #64748b; margin-top: 14px; }

  .note {
    position: relative; z-index: 1; max-width: 400px; margin: 18px auto 30px; padding: 0 16px;
  }
  .note div {
    background: #1a4a72; border-radius: 14px; padding: 12px 14px;
    font-size: 12.5px; font-weight: 600; text-align: center; line-height: 1.7; color: #e2e8f0;
  }
  .note b { color: #fcd34d; }
</style>
</head>
<body>
  <div class="bg-fx" aria-hidden="true"><i></i><i></i><i></i></div>

  <div class="stage">
    <!-- ===== Animated Doctor ===== -->
    <div class="doc-move" aria-hidden="true">
      <div class="doc-bob">
        <div class="mag">🔍</div>
        <svg viewBox="0 0 120 168" width="108" height="151">
          <!-- पाय -->
          <rect x="42" y="126" width="14" height="26" rx="6" fill="#1e3a5f"/>
          <rect x="64" y="126" width="14" height="26" rx="6" fill="#1e3a5f"/>
          <ellipse cx="47" cy="157" rx="11" ry="5" fill="#0a1a2e"/>
          <ellipse cx="73" cy="157" rx="11" ry="5" fill="#0a1a2e"/>
          <!-- कोट -->
          <path d="M38 62 Q60 52 82 62 L88 132 Q60 142 32 132 Z" fill="#ffffff" stroke="#d7e5f2" stroke-width="2"/>
          <line x1="60" y1="68" x2="60" y2="134" stroke="#d7e5f2" stroke-width="2"/>
          <path d="M52 60 L60 79 L68 60 Z" fill="#0d9488"/>
          <!-- डावा हात -->
          <rect x="25" y="64" width="14" height="50" rx="7" fill="#f2f8fd" stroke="#d7e5f2" stroke-width="2"/>
          <circle cx="32" cy="117" r="7" fill="#f6c89f"/>
          <!-- उजवा हात (हलणारा) -->
          <g class="arm-r">
            <rect x="81" y="64" width="14" height="50" rx="7" fill="#f2f8fd" stroke="#d7e5f2" stroke-width="2"/>
            <circle cx="88" cy="117" r="7" fill="#f6c89f"/>
          </g>
          <!-- स्टेथोस्कोप -->
          <g class="steth">
            <g stroke="#12324f" stroke-width="3.5" fill="none" stroke-linecap="round">
              <path d="M50 58 C48 78 44 92 40 100"/>
              <path d="M70 58 C72 78 76 92 80 100"/>
              <path d="M40 100 C44 112 52 116 60 116 C68 116 76 112 80 100"/>
            </g>
            <circle cx="60" cy="118" r="7" fill="#0d9488" stroke="#12324f" stroke-width="2.5"/>
            <circle cx="60" cy="118" r="2.4" fill="#e6fffa"/>
          </g>
          <!-- डोके -->
          <g class="doc-head">
            <circle cx="39" cy="37" r="4" fill="#f6c89f"/>
            <circle cx="81" cy="37" r="4" fill="#f6c89f"/>
            <circle cx="60" cy="35" r="21" fill="#f6c89f"/>
            <path d="M39 27 Q40 8 60 8 Q80 8 81 27 Q70 21 60 21 Q50 21 39 27 Z" fill="#ffffff" stroke="#d7e5f2" stroke-width="2"/>
            <rect x="39" y="22.5" width="42" height="7" rx="3.5" fill="#0d9488"/>
            <rect x="57" y="11" width="6" height="10" rx="1.5" fill="#0d9488"/>
            <rect x="55" y="13" width="10" height="6" rx="1.5" fill="#0d9488"/>
            <g class="eye-blink">
              <ellipse cx="52" cy="39" rx="5" ry="6" fill="#ffffff"/>
              <circle class="pupil" cx="52" cy="40" r="2.6" fill="#1b2a3a"/>
            </g>
            <g class="eye-blink">
              <ellipse cx="68" cy="39" rx="5" ry="6" fill="#ffffff"/>
              <circle class="pupil" cx="68" cy="40" r="2.6" fill="#1b2a3a"/>
            </g>
            <path d="M46 30 L58 30" stroke="#8a5a2b" stroke-width="2.4" stroke-linecap="round"/>
            <path d="M62 30 L74 30" stroke="#8a5a2b" stroke-width="2.4" stroke-linecap="round"/>
            <path d="M52 49 Q60 55 68 49" stroke="#7c4a1e" stroke-width="2.4" fill="none" stroke-linecap="round"/>
            <circle cx="45" cy="46" r="3.4" fill="#f0a080" opacity="0.55"/>
            <circle cx="75" cy="46" r="3.4" fill="#f0a080" opacity="0.55"/>
          </g>
        </svg>
      </div>
    </div>

    <div class="card-wrap">
      <div class="logo">
        <div class="logo-mark">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#0b1f33" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-3.6 8-10V5l-8-3-8 3v7c0 6.4 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>
          </svg>
        </div>
        <h1>आरोग्य सेवा अहवाल</h1>
        <p>Smart Reporting for Health Workers</p>
      </div>

      <section class="login-card">
        <div class="tabs">
          <div class="ind"></div>
          <span class="on">👥 कर्मचारी लॉगिन</span>
          <span class="off">🏢 PHC लॉगिन</span>
        </div>
        <div class="fld">
          <label>ईमेल</label>
          <div class="wrap"><i>✉️</i><input type="email" placeholder="you@example.com" disabled></div>
        </div>
        <div class="fld">
          <label>पासवर्ड</label>
          <div class="wrap"><i>🔒</i><input type="password" placeholder="••••••••" disabled></div>
        </div>
        <button class="btn" type="button" disabled>लॉगिन →</button>
        <div class="foot">खाते नाही? नोंदणी करा</div>
      </section>
    </div>
  </div>

  <div class="note">
    <div>हा फक्त <b>preview</b> आहे — डॉक्टर लॉगिन कार्डच्या <b>मागून डोकावतो</b>, बाजूला येऊन उभा राहतो, <b>भिंग घेऊन तपासतो</b> 🔍 आणि हात हलवतो 👋<br>आवडल्यास सांगा, app च्या लॉगिन स्क्रीनवर टाकतो 🩺</div>
  </div>
</body>
</html>
